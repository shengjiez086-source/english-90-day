<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>90天英语重建计划</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68738a;--line:#e5e9f0;--accent:#2457d6;--ok:#16834b;--bad:#c53b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head,main{max-width:1050px;margin:auto}.head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;margin:0}.sub,.small{font-size:12px;color:var(--muted)}.sub{margin-top:3px}
main{padding:16px 16px 70px}nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}nav button,.secondary{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;white-space:nowrap}
nav button.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:10px;padding:10px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 15px rgba(20,30,50,.04)}
.big{font-size:23px;line-height:1.45;font-weight:650}.zh{margin-top:7px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.stat{font-size:26px;font-weight:700}.progress{height:9px;background:#e9edf4;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--accent)}
.daylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.daybtn{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.daybtn.current{border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,87,214,.1)}
.word{display:flex;justify-content:space-between;gap:12px;align-items:center}.word b{font-size:20px}.pill{padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit;background:#fff}.feedback{margin-top:10px;padding:10px;border-radius:10px}.good{background:#eaf8f0;color:var(--ok)}.bad{background:#fff0f0;color:var(--bad)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:600px){main{padding:12px}.big{font-size:21px}}
</style></head><body>

const KEY="english90_v21";
const INTERVALS=[1,2,4,7,14,30,60];
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{currentDay:1,step:"today",speed:.85,mastery:{},errors:{},stats:{played:0,typed:0,correct:0,wrong:0}};
let idx={typing:0,translation:0};
const $=id=>document.getElementById(id);
const day=()=>COURSES.find(x=>x.day===state.currentDay)||COURSES[0];
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function norm(s){return String(s||"").toLowerCase().trim().replace(/[.,!?;:，。！？；：'"“”]/g,"").replace(/\s+/g," ");}
function speak(text,rate=state.speed,lang="en-US"){
 if(!("speechSynthesis"in window)){alert("当前浏览器不支持语音播放。请使用 Safari 或 Chrome。");return;}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;u.pitch=1;
 const vs=speechSynthesis.getVoices(),en=vs.filter(v=>/^en-US/i.test(v.lang));
 const v=en.find(x=>/female|samantha|karen|ava|allison|susan|victoria/i.test(x.name))||en[0];if(v)u.voice=v;
 speechSynthesis.speak(u);state.stats.played++;save();
}
function speakSeq(list,i=0,mode="blind"){
 if(i>=list.length)return;const u=new SpeechSynthesisUtterance(list[i]);u.lang="en-US";u.rate=mode==="slow"?.68:state.speed;
 const vs=speechSynthesis.getVoices(),en=vs.filter(v=>/^en-US/i.test(v.lang));if(en[0])u.voice=en.find(x=>/female|samantha|karen|ava|allison|susan|victoria/i.test(x.name))||en[0];
 u.onend=()=>setTimeout(()=>speakSeq(list,i+1,mode),mode==="blind"?600:1200);speechSynthesis.speak(u);
}
function nav(){
 const names={today:"今日",sentences:"句子",words:"单词",typing:"打字",translation:"翻译",listening:"盲听/跟读",mistakes:"错题",review:"复习",progress:"进度"};
 $("nav").innerHTML=Object.keys(names).map(k=>`<button class="${state.step===k?"active":""}" onclick="go('${k}')">${names[k]}</button>`).join("");
}
function go(s){speechSynthesis?.cancel();state.step=s;save();render();}
function setDay(d){state.currentDay=d;state.step="today";save();render();scrollTo(0,0);}
function completion(c){return Math.round(c.sentences.filter(s=>state.mastery[s.id]?.level>=2).length/c.sentences.length*100);}
function dayPicker(){return `<div class="card"><b>选择学习日</b><div class="daylist" style="margin-top:10px">${COURSES.map(c=>`<button class="daybtn ${c.day===state.currentDay?"current":""}" onclick="setDay(${c.day})"><b>Day ${c.day}</b><br><span class="small">${esc(c.title)}</span></button>`).join("")}</div></div>`;}
function render(){
 $("badge").textContent="Day "+state.currentDay;nav();const a=$("app"),c=day();
 if(state.step==="today")today(a,c);else if(state.step==="sentences")sentences(a,c);else if(state.step==="words")words(a,c);
 else if(state.step==="typing")typing(a,c);else if(state.step==="translation")translation(a,c);else if(state.step==="listening")listening(a,c);
 else if(state.step==="mistakes")mistakes(a);else if(state.step==="review")review(a);else progress(a);
}
function today(a,c){const p=completion(c);a.innerHTML=`<div class="card"><div class="small">DAY ${c.day} · ${c.phase}</div><h2>${esc(c.title)}</h2><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="small" style="margin-top:7px">今日掌握度 ${p}% · 10句核心句 + 单词 + 打字 + 翻译 + 听写 + 盲听</div><div class="row" style="margin-top:14px"><button class="primary" onclick="go('sentences')">开始今天学习</button><button class="secondary" onclick="blindAll()">▶ 今日全部盲听</button></div></div><div class="grid"><div class="card"><div class="stat">${c.sentences.length}</div>今日核心句</div><div class="card"><div class="stat">${c.words.length}</div>今日重点词</div><div class="card"><div class="stat">${state.stats.correct}</div>累计答对</div><div class="card"><div class="stat">${state.stats.typed}</div>累计打字</div></div>${dayPicker()}`;}
function sentences(a,c){a.innerHTML=`<div class="card"><h2>今日核心句</h2><div class="small">先听，再看英文；不要急着背答案。</div></div>`+c.sentences.map((s,i)=>`<div class="card"><div class="small">Sentence ${i+1}</div><div class="big">${esc(s.en)}</div><div class="zh">${esc(s.zh)}</div><div class="row" style="margin-top:12px"><button class="primary" onclick='speak(${JSON.stringify(s.en)})'>▶ 美式发音</button><button class="secondary" onclick='speak(${JSON.stringify(s.en)},.65)'>🐢 慢速</button><button class="secondary" onclick='mark("${s.id}",true);render()'>✓ 我掌握了</button></div></div>`).join("");}
function words(a,c){a.innerHTML=`<div class="card"><h2>今日重点词</h2><div class="small">单词不孤立记：词义 + 搭配 + 例句。</div></div>`+c.words.map(w=>`<div class="card word"><div><b>${esc(w.word)}</b><div class="zh">${esc(w.zh)}</div><div class="small" style="margin-top:6px">${esc(w.example)}</div></div><button class="primary" onclick='speak(${JSON.stringify(w.example)})'>▶</button></div>`).join("");}
function typing(a,c){const s=c.sentences[idx.typing%c.sentences.length];a.innerHTML=`<div class="card"><h2>完整句打字</h2><div class="small">看中文，完整输入英文。大小写和标点不严格计分。</div><div class="big" style="margin-top:14px">${esc(s.zh)}</div><textarea id="tin" rows="3" placeholder="输入完整英文句子……"></textarea><div class="row"><button class="primary" onclick="checkTyping()">检查</button><button class="secondary" onclick='speak(${JSON.stringify(s.en)})'>先听一次</button><button class="secondary" onclick="idx.typing++;typing($('app'),day())">下一句</button></div><div id="tf"></div></div>`;}
function checkTyping(){const s=day().sentences[idx.typing%day().sentences.length],ok=norm($("tin").value)===norm(s.en);state.stats.typed++;mark(s.id,ok);$("tf").className="feedback "+(ok?"good":"bad");$("tf").innerHTML=ok?"✓ 正确！":"✗ 标准答案："+esc(s.en);save();}
function translation(a,c){const s=c.sentences[idx.translation%c.sentences.length];a.innerHTML=`<div class="card"><h2>中文 → 英文</h2><div class="small">先独立回忆，再输入。</div><div class="big" style="margin-top:14px">${esc(s.zh)}</div><input id="tr" placeholder="输入英文……"><div class="row" style="margin-top:10px"><button class="primary" onclick="checkTranslation()">检查</button><button class="secondary" onclick="idx.translation++;translation($('app'),day())">下一题</button></div><div id="trf"></div></div>`;}
function checkTranslation(){const s=day().sentences[idx.translation%day().sentences.length],ok=norm($("tr").value)===norm(s.en);mark(s.id,ok);$("trf").className="feedback "+(ok?"good":"bad");$("trf").innerHTML=ok?"✓ 正确！":"✗ 标准答案："+esc(s.en);}
function listening(a,c){a.innerHTML=`<div class="card"><h2>盲听 + 跟读</h2><div class="small">保留原框架：英文 → 中文提示 → 英文慢速 → 停顿 → 英文正常速度 → 停顿。</div><div class="row" style="margin-top:14px"><button class="primary" onclick="guided()">▶ 今日跟读流程</button><button class="secondary" onclick="blindAll()">▶ 今日全部盲听</button><button class="secondary" onclick="speechSynthesis.cancel()">■ 停止</button></div><div style="margin-top:12px">语速：<select onchange="state.speed=parseFloat(this.value);save()"><option>.65</option><option>.75</option><option selected>.85</option><option>1</option></select></div></div>`;}
function guided(){speechSynthesis.cancel();const list=day().sentences;let i=0;function next(){if(i>=list.length)return;const s=list[i++],cn=new SpeechSynthesisUtterance(s.zh),slow=new SpeechSynthesisUtterance(s.en),normal=new SpeechSynthesisUtterance(s.en);cn.lang="zh-CN";slow.lang=normal.lang="en-US";slow.rate=.68;normal.rate=state.speed;cn.onend=()=>speechSynthesis.speak(slow);slow.onend=()=>setTimeout(()=>speechSynthesis.speak(normal),1300);normal.onend=()=>setTimeout(next,1500);speechSynthesis.speak(cn)}next();}
function blindAll(){speechSynthesis.cancel();speakSeq(day().sentences.map(s=>s.en));}
function mark(id,ok){const m=state.mastery[id]||{level:0,correct:0,wrong:0,next:0};if(ok){m.correct++;m.level=Math.min(6,m.level+1);state.stats.correct++;}else{m.wrong++;m.level=Math.max(0,m.level-1);state.stats.wrong++;state.errors[id]=(state.errors[id]||0)+1;}m.next=Date.now()+(INTERVALS[m.level]||1)*86400000;state.mastery[id]=m;save();}
function mistakes(a){const arr=Object.entries(state.errors).map(([id,n])=>{const s=COURSES.flatMap(c=>c.sentences).find(x=>x.id===id);return s?{s,n}:null}).filter(Boolean);a.innerHTML=`<div class="card"><h2>错题</h2><div class="small">错误会缩短复习间隔。</div></div>`+(arr.length?arr.map(x=>`<div class="card"><div class="big">${esc(x.s.en)}</div><div class="zh">${esc(x.s.zh)} · 错误 ${x.n} 次</div><button class="primary" onclick='speak(${JSON.stringify(x.s.en)})'>▶ 播放</button></div>`).join(""):`<div class="card">目前没有记录错题。</div>`);}
function review(a){const due=Object.entries(state.mastery).filter(([id,m])=>m.next<=Date.now()).map(([id,m])=>{const s=COURSES.flatMap(c=>c.sentences).find(x=>x.id===id);return s?{s,m}:null}).filter(Boolean);a.innerHTML=`<div class="card"><h2>间隔复习</h2><div class="small">1 → 2 → 4 → 7 → 14 → 30 → 60天；答错会回退。</div></div>`+(due.length?due.slice(0,12).map(x=>`<div class="card"><div class="big">${esc(x.s.en)}</div><div class="zh">${esc(x.s.zh)}</div><div class="row" style="margin-top:10px"><button class="primary" onclick='speak(${JSON.stringify(x.s.en)})'>▶ 听</button><button class="secondary" onclick='mark("${x.s.id}",true);render()'>✓ 会了</button><button class="secondary" onclick='mark("${x.s.id}",false);render()'>✗ 不会</button></div></div>`).join(""):`<div class="card">今天暂时没有到期复习内容。</div>`);}
function progress(a){const total=COURSES.reduce((n,c)=>n+c.sentences.length,0),mastered=Object.values(state.mastery).filter(x=>x.level>=4).length,p=Math.round(mastered/total*100);a.innerHTML=`<div class="card"><h2>90天进度</h2><div class="progress"><div class="bar" style="width:${p}%"></div></div><p>核心句熟练度：${mastered} / ${total}（${p}%）</p></div><div class="grid"><div class="card"><div class="stat">${state.stats.played}</div>播放次数</div><div class="card"><div class="stat">${state.stats.typed}</div>打字次数</div><div class="card"><div class="stat">${state.stats.correct}</div>答对</div><div class="card"><div class="stat">${state.stats.wrong}</div>答错</div></div><div class="card"><h3>数据备份</h3><div class="row"><button class="primary" onclick="exportData()">导出学习数据</button><button class="secondary" onclick="$('file').click()">导入学习数据</button><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><p class="small">学习记录只保存在当前浏览器；换设备时可以导入。</p></div>`;}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="english90-learning-backup.json";a.click();}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.mastery)throw 0;state=x;save();render();alert("学习数据已导入。")}catch{alert("导入失败：文件格式不正确。")}};r.readAsText(f);}
render();
</script></body></html>
